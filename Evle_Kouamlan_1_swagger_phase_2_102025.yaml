openapi: 3.0.0
info:
  title: Argent Bank API
  description: Documentation de l'API pour l'application bancaire Argent Bank (Phase 1 & 2).
  version: 2.0.0
servers:
  - url: http://localhost:3001/api/v1
    description: Serveur local de développement
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        userName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    
    Transaction:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the transaction
        date:
          type: string
          format: date
          description: Date of the transaction
        description:
          type: string
          description: Description or merchant name
        amount:
          type: number
          format: float
          description: Transaction amount
        balance:
          type: number
          format: float
          description: Account balance after transaction
        type:
          type: string
          description: Type of transaction (Electronic, Card, Transfer, etc.)
        category:
          type: string
          description: Transaction category (e.g., Food, Housing)
        notes:
          type: string
          description: User custom notes for the transaction
    
    ApiResponse:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
        body:
          type: object

paths:
  # --- Authentication & User (Phase 1) ---
  /user/login:
    post:
      tags:
        - User Authentication
      summary: User Login
      description: Authenticate a user with email and password to receive a JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: "tony@stark.com"
                password:
                  type: string
                  example: "password123"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "User successfully logged in"
                  body:
                    type: object
                    properties:
                      token:
                        type: string
        '400':
          description: Invalid fields
        '500':
          description: Internal Server Error

  /user/signup:
    post:
      tags:
        - User Authentication
      summary: User Signup
      description: Create a new user account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                userName:
                  type: string
      responses:
        '200':
          description: Signup successful
        '400':
          description: Invalid fields

  /user/profile:
    get:
      security:
        - bearerAuth: []
      tags:
        - User Profile
      summary: Fetch User Profile
      description: Retrieve the profile information of the currently logged-in user.
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Successfully got user profile data"
                  body:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized (Invalid or missing token)
    
    put:
      security:
        - bearerAuth: []
      tags:
        - User Profile
      summary: Update User Profile
      description: Update the user's userName.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userName:
                  type: string
                  description: New username to set
      responses:
        '200':
          description: User profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "User profile successfully updated"
                  body:
                    $ref: '#/components/schemas/User'
        '400':
          description: Invalid fields
        '401':
          description: Unauthorized

  # --- Transactions (Phase 2) ---
  
  /accounts/{accountId}/transactions:
    get:
      security:
        - bearerAuth: []
      tags:
        - Transactions
      summary: Fetch all transactions for an account
      description: Returns a list of all transactions for a specific account ID.
      parameters:
        - in: path
          name: accountId
          required: true
          schema:
            type: string
          description: The ID of the account
      responses:
        '200':
          description: Transactions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Successfully retrieved transactions"
                  body:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
        '401':
          description: Unauthorized
        '404':
          description: Account not found

  /transactions/{transactionId}:
    get:
      security:
        - bearerAuth: []
      tags:
        - Transactions
      summary: Fetch transaction details
      description: Get details of a specific transaction.
      parameters:
        - in: path
          name: transactionId
          required: true
          schema:
            type: string
          description: The ID of the transaction
      responses:
        '200':
          description: Transaction details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '401':
          description: Unauthorized
        '404':
          description: Transaction not found

    put:
      security:
        - bearerAuth: []
      tags:
        - Transactions
      summary: Update transaction notes and category
      description: Modify the category or notes of an existing transaction.
      parameters:
        - in: path
          name: transactionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: string
                  description: New category for the transaction
                notes:
                  type: string
                  description: New notes for the transaction
      responses:
        '200':
          description: Transaction updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '404':
          description: Transaction not found